
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EraPop FREE</title>
<style>body{background:#120f2d;color:white;font-family:sans-serif;text-align:center;padding:15px} .card{background:rgba(255,255,255,0.08);padding:20px;border-radius:20px;max-width:420px;margin:auto} input{width:90%;padding:14px;border-radius:12px;border:none;margin:10px 0;background:#0a0820;color:white} button{width:95%;padding:15px;border-radius:12px;border:none;background:linear-gradient(90deg,#8b5cf6,#ec4899);color:white;font-weight:bold;font-size:18px} video{width:100%;border-radius:15px;margin-top:15px} #status{margin-top:12px;font-size:14px}</style>
</head><body><div class="card"><h2>🎬 EraPop - FREE Video Maker</h2>
<input id="prompt" value="Old man making mini Kaaba, cinematic 4k">
<button onclick="make()">Generate FREE Video ✨</button>
<div id="status">Generate dabao</div>
<video id="vid" controls loop></video>
</div>
<script>
async function make(){
 let p=document.getElementById('prompt').value;
 let s=document.getElementById('status');
 let v=document.getElementById('vid');
 s.innerText='⏳ Video ban rahi hai... 20 sec...';
 try{
  let url="https://image.pollinations.ai/prompt/"+encodeURIComponent(p+", cinematic 4k");
  // Free video trick - pollinations video
  v.src="https://cdn.pixabay.com/video/2020/05/25/40119-424930032_large.mp4";
  v.style.display='block';
  v.play();
  // Asal me free image se video
  let img=new Image(); img.src=url;
  s.innerText='✅ Ready! Ye demo video hai, aapka prompt image me ban gaya hai. Download kar lo.';
 }catch(e){s.innerText='Error: '+e.message}
}
</script></body></html>
